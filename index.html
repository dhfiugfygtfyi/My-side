<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <main class="card">
    <h1>Регистрация</h1>
    <p class="subtitle">Создайте аккаунт — это займёт меньше минуты.</p>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="login">Логин</label>
        <input id="login" name="login" type="text" autocomplete="username"
               placeholder="например, player_one">
        <span class="error" id="login-error"></span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email"
               placeholder="you@example.com">
        <span class="error" id="email-error"></span>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               placeholder="Минимум 6 символов">
        <span class="error" id="password-error"></span>
      </div>

      <div class="field">
        <div class="cf-turnstile" data-sitekey="SITE_KEY" data-theme="light"></div>
        <span class="error" id="captcha-error"></span>
      </div>

      <button type="submit" class="btn">Зарегистрироваться</button>

      <div class="message" id="message" role="status" aria-live="polite"></div>
    </form>

    <p class="hint">Демо без сервера: логин и email сохраняются только в этом браузере.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
