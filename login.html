<!DOCTYPE html>
<html lang="ru" data-title-key="login.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — My-side</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">◈</span>
        <span class="brand-name">My<span class="brand-accent">-side</span></span>
      </a>
      <nav class="nav" id="site-nav" aria-label="Основная навигация" data-i18n-aria="nav.aria">
        <a href="index.html" data-i18n="nav.catalog">Каталог</a>
      </nav>
      <div class="header-actions">
        <div class="lang-switch" data-lang-switch role="group" aria-label="Язык сайта" data-i18n-aria="lang.aria">
          <button type="button" class="lang-btn" data-lang="ru" aria-pressed="false">RU</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Переключить тему" aria-pressed="false">☀️</button>
        <div class="auth-area" data-auth-area></div>
        <button type="button" class="nav-toggle" data-nav-toggle aria-label="Открыть меню" data-i18n-aria="nav.openMenu" aria-expanded="false" aria-controls="site-nav">☰</button>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1 data-i18n="login.h1">Вход</h1>
      <p class="subtitle" data-i18n="login.subtitle">Войдите в аккаунт My-side.</p>

      <p class="notice" id="already-notice" hidden>
        <span data-i18n="login.alreadyPrefix">Вы уже вошли как</span>
        <strong id="already-name">—</strong>.
        <span data-i18n="login.alreadySuffix">Можно войти под другим аккаунтом.</span>
      </p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login" data-i18n="login.identifier">Имя пользователя или email</label>
          <input id="login" name="login" type="text" autocomplete="username"
                 placeholder="player_one или you@example.com" data-i18n-placeholder="login.identifierPlaceholder" autofocus>
          <span class="field-error" id="login-error"></span>
        </div>

        <div class="field">
          <label for="password" data-i18n="login.password">Пароль</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password"
                   placeholder="Ваш пароль" data-i18n-placeholder="login.passwordPlaceholder">
            <button type="button" class="password-toggle" id="password-toggle"
                    aria-label="Показать пароль" data-i18n-aria="login.showAria" aria-pressed="false" data-i18n="login.show">Показать</button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <div class="field">
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAF1yWfZCbvIg8Vsw" data-theme="dark"></div>
          <span class="field-error" id="captcha-error"></span>
        </div>

        <p class="form-message" id="form-message" role="alert" aria-live="assertive"></p>

        <button type="submit" class="btn btn-primary btn-block" id="login-submit" data-i18n="login.submit">Войти</button>
      </form>

      <p class="auth-switch"><span data-i18n="login.noAccount">Нет аккаунта?</span> <a href="register.html" data-i18n="login.registerLink">Зарегистрироваться</a></p>
      <p class="hint" data-i18n-html="login.hint">Данные проверяются в этом браузере: логин и хеш пароля лежат в <code>localStorage</code>.</p>
    </div>
  </main>

  <footer class="site-footer">
    <p data-i18n="footer.demo">My-side · демо без сервера · данные хранятся в localStorage</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
