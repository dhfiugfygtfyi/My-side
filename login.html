<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — My-side</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">◈</span>
        <span class="brand-name">My<span class="brand-accent">-side</span></span>
      </a>
      <nav class="nav" aria-label="Основная навигация">
        <a href="index.html">Главная</a>
        <a class="is-active" href="login.html" aria-current="page">Вход</a>
        <a href="register.html">Регистрация</a>
      </nav>
      <div class="auth-area" data-auth-area></div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Вход</h1>
      <p class="subtitle">Войдите в аккаунт My-side.</p>

      <p class="notice" id="already-notice" hidden>
        Вы уже вошли как <strong id="already-name">—</strong>.
        Можно войти под другим аккаунтом.
      </p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login">Имя пользователя или email</label>
          <input id="login" name="login" type="text" autocomplete="username"
                 placeholder="player_one или you@example.com" autofocus>
          <span class="field-error" id="login-error"></span>
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password"
                   placeholder="Ваш пароль">
            <button type="button" class="password-toggle" id="password-toggle"
                    aria-label="Показать пароль" aria-pressed="false">Показать</button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <div class="field">
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAF1yWfZCbvIg8Vsw" data-theme="dark"></div>
          <span class="field-error" id="captcha-error"></span>
        </div>

        <p class="form-message" id="form-message" role="alert" aria-live="assertive"></p>

        <button type="submit" class="btn btn-primary btn-block" id="login-submit">Войти</button>
      </form>

      <p class="auth-switch">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
      <p class="hint">Данные проверяются в этом браузере: логин и хеш пароля лежат в <code>localStorage</code>.</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>My-side · демо без сервера · данные хранятся в localStorage</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
